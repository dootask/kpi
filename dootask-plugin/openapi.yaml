  /api/backup:
    post:
      operationId: createBackup
      summary: 创建数据库备份（内部/危险，HR）
      tags: [backup]
      x-doo-cli: false
      responses:
        '200':
          description: 备份结果
    get:
      operationId: getBackupHistory
      summary: 获取备份历史（内部，HR）
      tags: [backup]
      x-doo-cli: false
      responses:
        '200':
          description: 备份历史列表

  /api/backup/download/{filename}:
    get:
      operationId: generateBackupDownloadURL
      summary: 生成备份下载链接（内部，HR）
      tags: [backup]
      x-doo-cli: false
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 下载链接

  /api/backup/restore/{filename}:
    post:
      operationId: restoreBackup
      summary: 恢复数据库（内部/危险，HR）
      tags: [backup]
      x-doo-cli: false
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 恢复结果

  /api/backup/{filename}:
    delete:
      operationId: deleteBackup
      summary: 删除备份文件（内部/危险，HR）
      tags: [backup]
      x-doo-cli: false
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 删除结果

components:
  schemas:
    UserEventRequest:
      type: object
      properties:
        user_id: { type: integer }
        email: { type: string }
        user_name: { type: string }
        user_role: { type: string }

    SystemSettings:
      type: object
      properties:
        allow_registration: { type: boolean }
        system_mode: { type: string, enum: [standalone, integrated] }

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    EmployeeInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        position: { type: string }
        department_id: { type: integer }
        manager_id: { type: integer, nullable: true }
        role: { type: string, enum: [employee, manager, hr] }
        is_active: { type: boolean }

    Employee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        position: { type: string }
        department_id: { type: integer }
        manager_id: { type: integer, nullable: true }
        role: { type: string }
        is_active: { type: boolean }

    TemplateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        period: { type: string, enum: [monthly, quarterly, yearly] }
        is_active: { type: boolean }

    ItemInput:
      type: object
      required: [name]
      properties:
        template_id: { type: integer }
        name: { type: string }
        description: { type: string }
        max_score: { type: number }
        order: { type: integer }

    EvaluationInput:
      type: object
      properties:
        employee_id: { type: integer }
        template_id: { type: integer }
        period: { type: string }
        year: { type: integer }
        month: { type: integer, nullable: true }
        quarter: { type: integer, nullable: true }
        status: { type: string, enum: [pending, self_evaluated, manager_evaluated, pending_confirm, completed] }
        total_score: { type: number }
        final_comment: { type: string }
        objection_reason: { type: string }

    PerformanceRuleNoInvitation:
      type: object
      properties:
        self_weight: { type: number }
        superior_weight: { type: number }

    PerformanceRuleEmployee:
      type: object
      properties:
        self_weight: { type: number }
        invite_superior_weight: { type: number }
        superior_weight: { type: number }

    PerformanceRuleWithInvite:
      type: object
      properties:
        employee:
          $ref: '#/components/schemas/PerformanceRuleEmployee'

    PerformanceRule:
      type: object
      properties:
        id: { type: integer }
        no_invitation:
          $ref: '#/components/schemas/PerformanceRuleNoInvitation'
        with_invitation:
          $ref: '#/components/schemas/PerformanceRuleWithInvite'
        enabled: { type: boolean }

    PerformanceRulePayload:
      type: object
      required: [no_invitation, with_invitation]
      properties:
        no_invitation:
          $ref: '#/components/schemas/PerformanceRuleNoInvitation'
        with_invitation:
          $ref: '#/components/schemas/PerformanceRuleWithInvite'
        enabled: { type: boolean }
