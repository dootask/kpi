  /api/statistics/dashboard:
    get:
      operationId: getDashboardStats
      summary: 获取仪表盘统计
      tags: [statistics]
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string } }
        - { name: month, in: query, schema: { type: integer } }
        - { name: quarter, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 仪表盘统计数据

  /api/statistics/department/{id}:
    get:
      operationId: getDepartmentStats
      summary: 获取部门统计
