      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/export/department/{id}:
    get:
      operationId: exportDepartmentToExcel
      summary: 导出部门评估为 Excel（HR/管理员）
      tags: [export]
      description: 返回 Excel 文件（application/vnd.openxmlformats-officedocument.spreadsheetml.sheet）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/export/period/{period}:
    get:
      operationId: exportPeriodToExcel
      summary: 导出周期评估为 Excel（HR/管理员）
      tags: [export]
      description: 返回 Excel 文件（application/vnd.openxmlformats-officedocument.spreadsheetml.sheet）。period 取值如 monthly/quarterly/yearly。
      parameters:
        - { name: period, in: path, required: true, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer } }
        - { name: quarter, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
